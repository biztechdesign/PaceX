<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaceX — Manual · Change Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#091616; --sidebar:#0d1f1f; --card:#112424; --card2:#163030;
    --border:#1e3d3d; --ab:rgba(86,204,200,0.25);
    --text:#e8f4f4; --muted:#6aacaa;
    --accent:#56ccc8; --accent-bg:rgba(86,204,200,0.12);
    --grad:linear-gradient(135deg,#0d1f1f 0%,#1a3a3a 100%);
    --font:'Montserrat','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);-webkit-font-smoothing:antialiased;}
  .label{font-size:13px;font-weight:700;color:#1b2828;}
  .sub{font-size:12px;color:#6a655e;margin-top:2px;}

  .track{display:flex;height:100%;transition:transform .4s cubic-bezier(.3,.7,.3,1);}
  .slide{flex:0 0 100%;height:100%;overflow-y:auto;scrollbar-width:none;}
  .slide::-webkit-scrollbar{display:none;}

  .shot{position:relative;width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--border);background:var(--card2);}
  .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .shot .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:12px;display:none; }
  .shot .ph .pp{font-size:11px;font-weight:600;opacity:.85;word-break:break-all;line-height:1.35;display:none;}

  .stepbadge{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:28px;padding:0 12px;border-radius:999px;background:rgba(9,22,22,.4);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:700;}

  .dot{width:8px;height:8px;border-radius:999px;background:var(--border);transition:all .3s ease;}
  .dot.on{width:26px;background:var(--accent);}

  .nav{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:999px;font-family:var(--font);font-weight:700;font-size:15px;cursor:pointer;transition:transform .1s ease,background .15s ease,opacity .2s ease;}
  .nav.ghost{background:transparent;border:1.5px solid var(--ab);color:var(--accent);}
  .nav.ghost:active{transform:translateY(1px);background:var(--accent-bg);}
  .nav.fill{background:var(--accent);border:none;color:#091616;box-shadow:0 6px 16px rgba(86,204,200,.22);}
  .nav.fill:active{transform:translateY(1px);}
  .nav:disabled{opacity:0;pointer-events:none;}

  .num{width:30px;height:30px;border-radius:999px;background:var(--accent);color:#091616;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none;}

  .toast{position:absolute;left:24px;right:24px;bottom:96px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;transform:translateY(16px);opacity:0;transition:transform .25s ease,opacity .25s ease;z-index:60;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.5);}
  .toast.show{transform:translateY(0);opacity:1;}
  @media (prefers-reduced-motion: reduce){.track{transition:none;}}
</style>
</head>
<body>
<div style="width:max-content;min-width:100%;min-height:100vh;box-sizing:border-box;padding:48px;background:#e7e5df;font-family:var(--font);">
  <div style="margin-bottom:30px;max-width:760px;">
    <div style="font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#8a8076;">PaceX · User manuals</div>
    <div style="font-size:27px;font-weight:800;color:#1b2828;letter-spacing:-0.6px;margin-top:5px;">Manual — Change Password</div>
    <div style="font-size:14px;line-height:1.55;color:#5c574f;margin-top:9px;">An interactive 4-step walkthrough in the dark PaceX system. Each step is a screenshot + caption; <b style="color:#2b3a3a;">Next / Previous</b> slide between steps, the counter and dots track progress. Drop your screenshots into the <code style="background:#d9d6cd;padding:1px 4px;border-radius:3px;">img</code> paths.</div>
  </div>

  <div style="flex:none;width:390px;">
    <div style="width:390px;height:844px;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(20,40,40,.28);border:1px solid rgba(0,0,0,.12);display:flex;flex-direction:column;">

      <!-- hero header -->
      <div style="position:relative;flex:none;background:var(--grad);">
        <div style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:600;font-size:14px;color:var(--text);"><span>4:15</span><span style="display:flex;gap:6px;align-items:center;"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.4c2.2 0 4.2.9 5.7 2.3L8.5 10.4 2.8 4.7A8.1 8.1 0 0 1 8.5 2.4Z"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="3" y="3" width="16" height="6" rx="1.5" fill="currentColor"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="currentColor" fill-opacity=".5"/></svg></span></div>
        <div style="display:flex;align-items:center;gap:12px;padding:6px 18px 16px;">
          <button onclick="toast('Back to manual')" aria-label="Back" style="width:40px;height:40px;border-radius:11px;background:rgba(9,22,22,.4);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;flex:none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
          <div style="flex:1;font-size:19px;font-weight:800;letter-spacing:-0.3px;color:var(--text);text-align:center;">Change Password</div>
          <span class="stepbadge" id="counter">1/4</span>
        </div>
        <!-- progress bar -->
        <div style="height:3px;background:rgba(9,22,22,.35);"><div id="bar" style="height:100%;width:25%;background:var(--accent);border-radius:0 3px 3px 0;transition:width .4s ease;"></div></div>
      </div>

      <!-- carousel -->
      <div style="flex:1;overflow:hidden;position:relative;background:var(--bg);">
        <div class="track" id="track"></div>
      </div>

      <!-- dots -->
      <div id="dots" style="flex:none;display:flex;justify-content:center;gap:8px;padding:14px 0 6px;background:var(--bg);"></div>

      <!-- footer nav -->
      <div style="flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 18px 16px;background:var(--bg);">
        <button class="nav ghost" id="prev" onclick="go(-1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>Previous</button>
        <button class="nav fill" id="next" onclick="go(1)">Next <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>

      <div style="position:absolute;left:50%;transform:translateX(-50%);bottom:6px;width:130px;height:5px;border-radius:999px;background:rgba(232,244,244,.18);"></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
  var STEPS=[
      { n: 1, title: 'Open your Profile', desc: 'Tap the Profile tab, then choose Change Password from the settings list.', img:'images/change-pwd.jpg'},
      { n: 2, title: 'Enter your current password', desc: 'Type the password you use now so we can verify it\u2019s really you.', img:'images/change-pwd.jpg'},
      { n: 3, title: 'Set a new password', desc: 'Choose a new password and retype it. Watch the strength meter \u2014 it must differ from the old one.', img:'images/change-pwd.jpg'},
      { n: 4, title: 'Save and you\u2019re done', desc: 'Tap Change Password. You\u2019ll see a confirmation and can sign in with your new password next time.', img:'images/change-pwd.jpg'}
  ];
  var idx=0;

  function slideHtml(s){
    return '<div class="slide"><div style="padding:18px 20px 24px;display:flex;flex-direction:column;min-height:100%;">'
      + '<div class="shot" style="height:380px;"><img src="'+s.img+'" alt="" onerror="this.style.display=\'none\'"><div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg><div class="pp">'+s.img+'</div></div></div>'
      + '<div style="display:flex;align-items:center;gap:11px;margin-top:22px;"><span class="num">'+s.n+'</span><div style="font-size:19px;font-weight:800;color:var(--text);letter-spacing:-0.3px;line-height:1.2;">'+s.title+'</div></div>'
      + '<p style="font-size:15px;line-height:1.6;color:var(--muted);margin:14px 0 0;">'+s.desc+'</p>'
      + '</div></div>';
  }

  function render(){
    document.getElementById('track').innerHTML=STEPS.map(slideHtml).join('');
    document.getElementById('dots').innerHTML=STEPS.map(function(_,i){ return '<span class="dot'+(i===0?' on':'')+'"></span>'; }).join('');
    update();
  }
  function update(){
    document.getElementById('track').style.transform='translateX(-'+(idx*100)+'%)';
    document.getElementById('counter').textContent=(idx+1)+'/'+STEPS.length;
    document.getElementById('bar').style.width=((idx+1)/STEPS.length*100)+'%';
    [].forEach.call(document.getElementById('dots').children,function(d,i){ d.classList.toggle('on', i===idx); });
    document.getElementById('prev').disabled = idx===0;
    var next=document.getElementById('next');
    if(idx===STEPS.length-1){ next.innerHTML='Done <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>'; }
    else { next.innerHTML='Next <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>'; }
  }
  function go(dir){
    if(dir===1 && idx===STEPS.length-1){ toast('Guide complete'); return; }
    idx=Math.max(0,Math.min(STEPS.length-1, idx+dir));
    update();
  }

  // swipe support
  var sx=null;
  var carousel=document.getElementById('track');
  document.addEventListener('DOMContentLoaded',function(){});
  function bindSwipe(){
    var area=document.querySelector('.track').parentElement;
    area.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
    area.addEventListener('touchend',function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40){ go(dx<0?1:-1); } sx=null; });
  }

  render(); bindSwipe();

  function toast(msg){
    var el=document.getElementById('toast');
    el.innerHTML='<span style="color:var(--accent);display:flex;flex:none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span><span style="font-size:13px;font-weight:600;color:var(--text);">'+msg+'</span>';
    el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(function(){ el.classList.remove('show'); },2200);
  }
</script>
</body>
</html>
