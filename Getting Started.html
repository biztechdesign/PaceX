<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaceX — Getting Started</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#091616; --sidebar:#0d1f1f; --card:#112424; --card2:#163030;
    --border:#1e3d3d; --ab:rgba(86,204,200,0.25);
    --text:#e8f4f4; --muted:#6aacaa;
    --accent:#56ccc8; --accent-bg:rgba(86,204,200,0.12);
    --coral:#f97362; --coral-bg:rgba(249,115,98,0.14);
    --font:'Montserrat','Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font);-webkit-font-smoothing:antialiased;}
  .ph-scroll{scrollbar-width:none;-ms-overflow-style:none;}
  .ph-scroll::-webkit-scrollbar{width:0;height:0;display:none;}

  .img-wrap{position:relative;overflow:hidden;background:var(--card2);}
  .img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
    .img-ph {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: var(--muted);
        text-align: center;
        padding: 8px;
        display: none;
    }
  .img-ph .pp{font-size:10px;font-weight:600;opacity:.8;word-break:break-all;line-height:1.3;display:none;}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--border);}
  .chip.img{color:var(--accent);background:var(--accent-bg);border-color:var(--ab);}
  .chip.vid{color:var(--coral);background:var(--coral-bg);border-color:rgba(249,115,98,0.3);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;cursor:pointer;transition:border-color .15s ease,transform .1s ease;-webkit-tap-highlight-color:transparent;overflow:hidden;animation:pop .3s ease both;}
  .card:active{transform:scale(.995);border-color:var(--ab);}
  @keyframes pop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:999px;background:rgba(9,22,22,.55);backdrop-filter:blur(4px);border:1.5px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .2s ease;}
  .card:hover .play{transform:translate(-50%,-50%) scale(1.08);}

  .toast{position:absolute;left:24px;right:24px;bottom:24px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 15px;display:flex;gap:10px;align-items:center;transform:translateY(16px);opacity:0;transition:transform .25s ease,opacity .25s ease;z-index:90;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.5);color:var(--text);font-size:13px;font-weight:600;}
  .toast.show{opacity:1;transform:translateY(0);}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>
<!-- IMAGE PATHS: images/manual-change-password.jpg · images/manual-first-testdrive.jpg -->
<div style="width:max-content;min-width:100%;min-height:100vh;box-sizing:border-box;padding:48px;background:#e7e5df;font-family:var(--font);">
  <div style="margin-bottom:30px;max-width:760px;">
    <div style="font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#8a8076;">PaceX · User manuals</div>
    <div style="font-size:27px;font-weight:800;color:#1b2828;letter-spacing:-0.6px;margin-top:5px;">Getting Started</div>
    <div style="font-size:14px;line-height:1.55;color:#5c574f;margin-top:9px;">Thumbnail-card topics inside the manual. Each shows a media preview — drop your screenshot/still into the <code style="background:#d9d6cd;padding:1px 4px;border-radius:3px;">img</code> path; video topics get a play overlay. Tap a card to open the topic.</div>
  </div>

  <div style="flex:none;width:390px;">
    <div style="width:390px;height:844px;background:var(--bg);border-radius:40px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(20,40,40,.28);border:1px solid rgba(0,0,0,.12);display:flex;flex-direction:column;">

      <!-- status bar -->
      <div style="height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:600;font-size:14px;color:var(--text);"><span>4:14</span><span style="display:flex;gap:6px;align-items:center;"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.4c2.2 0 4.2.9 5.7 2.3L8.5 10.4 2.8 4.7A8.1 8.1 0 0 1 8.5 2.4Z"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x="1" y="1" width="21" height="10" rx="3" stroke="currentColor" stroke-opacity=".5"/><rect x="3" y="3" width="16" height="6" rx="1.5" fill="currentColor"/><rect x="23.5" y="4" width="2" height="4" rx="1" fill="currentColor" fill-opacity=".5"/></svg></span></div>

      <!-- app bar -->
      <div style="flex:none;display:flex;align-items:center;gap:14px;padding:6px 18px 14px;border-bottom:1px solid var(--border);"><button onclick="toast('Back to manuals')" aria-label="Back" style="width:40px;height:40px;border-radius:11px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button><div style="font-size:20px;font-weight:800;letter-spacing:-0.3px;color:var(--text);">Getting Started</div></div>

      <!-- list -->
      <div class="ph-scroll" id="list" style="flex:1;overflow-y:auto;background:var(--bg);"></div>

      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
  var TOPICS=[
      { id: 'cp', title: 'Change Password', desc: 'Step-by-step guide to creating a new test drive, scanning a licence, and starting the drive.', images: 3, video: false, img:'images/change-pwd.jpg'},
      { id: 'fd', title: 'Your first testdrive registration within 50 seconds', desc: 'Your first testdrive registration within 50 seconds.', images: 2, video: true, img:'images/drive.jpg'}
  ];

  function imgPhSvg(){ return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg>'; }
  function imgChipSvg(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="M21 7v12a2 2 0 0 1-2 2H7"/><circle cx="8" cy="10" r="1.4"/><path d="m4 16 3.5-3 3 2.5"/></svg>'; }
  function vidChipSvg(){ return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg>'; }
  function playSvg(){ return '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>'; }
  function chips(t){ var h=''; if(t.video) h+='<span class="chip vid">'+vidChipSvg()+'Video</span>'; h+='<span class="chip img">'+imgChipSvg()+t.images+' images</span>'; return h; }

  function render(){
    document.getElementById('list').innerHTML='<div style="padding:16px 18px 24px;display:flex;flex-direction:column;gap:16px;">'+TOPICS.map(function(t){
      return '<div class="card" onclick="toast(\'Open · '+t.title.slice(0,22).replace(/'/g,"")+'\')">'
        + '<div class="img-wrap" style="height:150px;"><img src="'+t.img+'" alt="" onerror="this.style.display=\'none\'"><div class="img-ph">'+imgPhSvg()+'<div class="pp">'+t.img+'</div></div>'+(t.video?'<div class="play">'+playSvg()+'</div>':'')+'</div>'
        + '<div style="padding:14px 16px 16px;"><div style="display:flex;gap:8px;margin-bottom:9px;">'+chips(t)+'</div>'
        + '<div style="font-size:16px;font-weight:700;color:var(--text);line-height:1.25;">'+t.title+'</div>'
        + '<div style="font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45;">'+t.desc+'</div></div></div>';
    }).join('')+'</div>';
  }
  render();

  function toast(msg){
    var el=document.getElementById('toast');
    el.innerHTML='<span style="color:var(--accent);display:flex;flex:none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></span><span style="font-size:13px;font-weight:600;color:var(--text);">'+msg+'</span>';
    el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(function(){ el.classList.remove('show'); },2200);
  }
</script>
</body>
</html>
